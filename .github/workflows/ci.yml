name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6
      - name: gofmt
        run: make fmt
      - name: Install rsync for migration rehearsals
        run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Test
        env:
          NOMCTL_REQUIRE_RSYNC: "1"
        run: go test ./...
      - name: Docs build
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && node --test plugins/llms-txt.test.js && npm run build
        working-directory: website
      - name: Cross-compile
        run: make cross

  scheduleproof:
    runs-on: ubuntu-latest
    container: golang:1.26-bookworm
    defaults:
      run:
        working-directory: experiments/scheduleproof
    steps:
      - uses: actions/checkout@v4
      - name: Standalone schedule sync, restart, and fork checks
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go build ./cmd/scheduleproof
