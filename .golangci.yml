version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*os.File).Close
        - (io.Closer).Close
formatters:
  enable:
    - gofmt
